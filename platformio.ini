; Open this folder in VS Code with the PlatformIO IDE extension.
; Build, upload, and serial monitor are the PlatformIO toolbar actions.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    madhephaestus/ESP32Servo@3.2.1

; Optional Wi-Fi. These override include/secrets.h when set.
; Leave WIFI_SSID empty to start the ESP-PowerOn access point only.
; build_flags =
;     -D WIFI_SSID=\"your-ssid\"
;     -D WIFI_PASSWORD=\"your-password\"
